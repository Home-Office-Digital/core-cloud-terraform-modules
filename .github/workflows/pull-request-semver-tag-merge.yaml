name: 'SemVer Tag on Main Merge'
on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  pull-requests: read
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  semver-tag:
    name: 'Tag Repository with SemVer'
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'skip-release') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse the SemVer label
        id: label
        uses: Home-Office-Digital/core-cloud-match-label-action@a8e8e2690df0a1f72550875a29a73574fdefe5ad # v1.0.10
        with:
          labels: minor,major,patch
          mode: singular

      - name: Calculate SemVer value
        id: calculate
        uses: Home-Office-Digital/core-cloud-semver-calculate-action@fd7e1629eda3b5d3cd037d4145d49db12a352c8e # v2.0.7
        with:
          increment: ${{ steps.label.outputs.matchedLabels }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PEM_FILE }}

      - name: Tag Repository
        uses: Home-Office-Digital/core-cloud-semver-tag-action@c95496307c40862d4e1659b47b7387f8a254a2d1 # v4.0.3
        with:
          tag: ${{ steps.calculate.outputs.version }}
          github_token: ${{ steps.app-token.outputs.token }}
