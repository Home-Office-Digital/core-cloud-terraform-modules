name: SAST Scans

on:
  workflow_call:
    secrets:
      sonar_token:
        required: true
      sonar_host_url:
        required: true
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

jobs:
  checkov-scan:
    name: Run Checkov Scan
    if: github.actor != 'dependabot[bot]'
    uses: Home-Office-Digital/core-cloud-workflow-checkov-sast-scan/.github/workflows/checkov-scan-tfplan.yaml@bf0a3944e6be34048d21f414ffabc638da9e1401 # 1.22.1
    with:
      path: '.'
  sonarqube-scan:
    name: Run SonarQube Scan
    if: github.actor != 'dependabot[bot]'
    uses: Home-Office-Digital/core-cloud-workflow-sonarqube-scan/.github/workflows/sonarqube-scan.yaml@43cc08418ced802ad127b754acd51f16b75bccbe # 1.3.0
    secrets:
      sonar_token: ${{ secrets.sonar_token }}
      sonar_host_url: ${{ secrets.sonar_host_url }}